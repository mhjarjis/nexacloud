name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish GitHub release
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nexacloud-dist
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "NexaCloud $GITHUB_REF_NAME" \
            --generate-notes

  verify:
    name: Install the published release (${{ matrix.os }})
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install from GitHub release (no local package)
        run: sudo bash scripts/install.sh --version "$GITHUB_REF_NAME" | tee install.log
      - name: Health + login
        run: |
          set -euo pipefail
          PASS="$(sed -n 's/^  Password:  //p' install.log | head -1)"
          U=https://127.0.0.1:8443
          curl -fsk "$U/api/health"
          curl -fsk -c jar -H "Origin: $U" -H 'Content-Type: application/json' -d "{\"password\":\"$PASS\"}" "$U/api/auth/login"
          curl -fsk -b jar "$U/api/overview"
